    <script>
        (function() {
            var rawPath = window.location.pathname;
            var clean = rawPath.replace(/\/+$/, '').toLowerCase();
            
            var map = {
                '/services': '/services',
                '/our-services': '/services',
                '/flexible-endoscope-repair': '/services',
                '/colonoscope-repair': '/colonoscope-repair',
                '/colonoscope-repair-services': '/colonoscope-repair',

                '/equipment-for-sale': '/equipment-for-sale',
                '/handling-procedures': '/handling-procedures',
                '/handling-equipment': '/handling-procedures',
                '/causes-of-endoscope-damage': '/handling-procedures',
                '/water-damage-inside-endoscopes-due-to-leakage': '/handling-procedures',
                '/broken-angulation-in-flexible-endoscopes': '/handling-procedures',
                '/contact': '/contact',
                '/contact-us': '/contact',
                '/contact-us.html': '/contact',
                '/loan-endoscopes': '/loan-endoscopes',
                '/flexible-endoscope-loaner': '/loan-endoscopes',
                '/loan-endoscope-service-keep-your-clinic-running-without-downtime': '/loan-endoscopes',
                '/loaner-tc': '/loaner-tc',
                '/warranty': '/warranty',
                '/warranty-policy': '/warranty',
                '/warranty-policy.html': '/warranty'
            };

            if (map[clean]) {
                window.location.replace(map[clean] + window.location.search + window.location.hash);
                return;
            }

            if (clean.indexOf('/wp-content') === 0 || 
                clean.indexOf('/wp-json') === 0 || 
                clean.indexOf('/category') === 0 || 
                clean.indexOf('/tag') === 0 || 
                clean.indexOf('/author') === 0 ||
                /^\/[0-9]+-[0-9]+$/.test(clean)) {
                window.location.replace('/' + window.location.search + window.location.hash);
                return;
            }

            if (rawPath.length > 1 && rawPath.slice(-1) === '/') {
                window.location.replace(rawPath.slice(0, -1) + window.location.search + window.location.hash);
            }
        })();
    </script>
